<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Café XVIII - Links</title>

    <!-- Google Fonts for Luxury Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <script src="index.js"></script>
    <div class="bg-overlay"></div>

    <main class="container">
      <!-- Header / Branding Section -->
      <header class="profile">
        <div class="logo-wrapper">
          <img
            src="Background (2).png"
            alt="Café XVIII Logo"
            class="logo-img"
          />
        </div>
        <h1 class="brand-title">CAFÉ XVIII</h1>
        <div class="brand-divider"><span>18</span></div>
      </header>

      <div class="quote-container" dir="rtl">
        <p id="coffee-quote"></p>
      </div>

      <!-- Primary Social Links -->
      <section class="links-container">
        <!-- Instagram (Active) -->
        <a
          href="https://www.instagram.com/hama__018/"
          target="_blank"
          rel="noopener noreferrer"
          class="link-card"
        >
          <i class="fa-brands fa-instagram link-icon"></i>
          <span class="link-text">Follow us on Instagram</span>
          <i class="fa-solid fa-arrow-up-right-from-square arrow-icon"></i>
        </a>

        <a
          href="https://www.tiktok.com/@hama__018?_r=1&_t=ZS-99fib2nIjOG"
          target="_blank"
          rel="noopener noreferrer"
          class="link-card"
        >
          <i class="fa-brands fa-tiktok link-icon"></i>
          <span class="link-text">Follow us on TikTok</span>
          <i class="fa-solid fa-arrow-up-right-from-square arrow-icon"></i>
        </a>

        <!-- Direct Call / Contact -->
        <a href="tel:+21694387252" class="link-card secondary">
          <i class="fa-solid fa-phone link-icon"></i>
          <span class="link-text">Call Us</span>
          <i class="fa-solid fa-chevron-right arrow-icon"></i>
        </a>
      </section>

      <!-- Footer -->
      <footer>
        <p>&copy; Café XVIII 18.</p>
      </footer>
    </main>
  </body>
</html>
